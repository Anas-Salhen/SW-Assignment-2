<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgeteer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'DM Sans', sans-serif; }
        h1, h2, .brand { font-family: 'Syne', sans-serif; }

        body {
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .gradient-text {
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: rgba(255,255,255,0.7);
            transition: color 0.2s;
            font-weight: 500;
        }

        .nav-link:hover { color: white; }

        .btn-primary {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 10px 22px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(167, 139, 250, 0.5);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 { width: 500px; height: 500px; background: #a78bfa; top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: #60a5fa; bottom: -50px; right: -50px; }
        .orb-3 { width: 300px; height: 300px; background: #34d399; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        main { position: relative; z-index: 1; }
        nav  { position: relative; z-index: 2; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up   { animation: fadeUp 0.6s ease forwards; }
        .fade-up-2 { animation: fadeUp 0.6s ease 0.1s forwards; opacity: 0; }
        .fade-up-3 { animation: fadeUp 0.6s ease 0.2s forwards; opacity: 0; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <nav class="glass border-b border-white/10 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/home/" class="brand text-2xl font-extrabold gradient-text">
                Budgeteer 💸
            </a>
            <div class="flex items-center gap-6">
                <a href="/home/"              class="nav-link">Dashboard</a>
                <a href="/set-budget-view/"   class="nav-link">Set Budget</a>
                <a href="/view-balance-view/" class="nav-link">Balance</a>
                <a href="/goals-view/"         class="nav-link">Goals </a>
                <a href="/report-view/"        class="nav-link">Report</a>
                <a href="/add/"                class="btn-primary">+ Add Transaction</a>
                <a href="/logout/"             class="nav-link text-red-400">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-10 px-4 pb-16">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
