{% extends 'Budgeteer/base.html' %}

{% block content %}

<div class="max-w-lg mx-auto fade-up">

    <!-- Header -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4" style="background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(96,165,250,0.2)); border: 1px solid rgba(167,139,250,0.3);">
            📝
        </div>
        <h2 class="text-3xl font-extrabold text-white">New Transaction</h2>
        <p class="text-white/40 mt-1">Record your income or expense</p>
    </div>

    <!-- Form Card -->
    <div class="glass-card rounded-2xl p-8">
        <form method="POST">
            {% csrf_token %}

            <!-- Description -->
            <div class="mb-6">
                <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Description</label>
                <input type="text" name="title"
                       placeholder="e.g. May Salary, Electricity Bill"
                       class="w-full rounded-xl px-4 py-3 text-white placeholder-white/25 font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50"
                       style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
            </div>

            <!-- Amount + Type -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Amount</label>
                    <input type="number" name="amount" placeholder="0.00"
                           class="w-full rounded-xl px-4 py-3 text-white placeholder-white/25 font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50"
                           style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
                </div>
                <div>
                    <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Type</label>
                    <select name="type"
                            class="w-full rounded-xl px-4 py-3 text-white font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50 cursor-pointer"
                            style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
                        <option value="income" style="background: #302b63;">💚 Income</option>
                        <option value="expense" style="background: #302b63;">❤️ Expense</option>
                    </select>
                </div>
            </div>

            <!-- Note -->
            <div class="mb-8 flex items-start gap-2 rounded-xl px-4 py-3" style="background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.2);">
                <span class="text-violet-400 mt-0.5">ℹ️</span>
                <p class="text-white/40 text-sm">Income will be added to your balance. Expenses will be deducted automatically.</p>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary w-full py-4 text-base font-bold rounded-xl text-center">
                Save Transaction
            </button>

        </form>
    </div>

    <!-- Back link -->
    <div class="text-center mt-6">
        <a href="/api/home/" class="text-white/30 hover:text-white/60 text-sm transition">← Back to Dashboard</a>
    </div>

</div>

{% endblock %}
