{% extends 'Budgeteer/base.html' %}

{% block content %}

<div class="max-w-md mx-auto fade-up">

    <!-- Header -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4" style="background: linear-gradient(135deg, rgba(52,211,153,0.2), rgba(96,165,250,0.2)); border: 1px solid rgba(52,211,153,0.3);">
            🚀
        </div>
        <h2 class="text-3xl font-extrabold text-white">Create Account</h2>
        <p class="text-white/40 mt-1">Start managing your budget today</p>
    </div>

    <!-- Error Message -->
    {% if error %}
    <div class="mb-6 rounded-xl px-4 py-3 flex items-center gap-2 fade-up" style="background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);">
        <span>⚠️</span>
        <p class="text-red-400 text-sm font-medium">{{ error }}</p>
    </div>
    {% endif %}

    <!-- Success Message -->
    {% if success %}
    <div class="mb-6 rounded-xl px-4 py-3 flex items-center gap-2 fade-up" style="background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3);">
        <span>✅</span>
        <p class="text-emerald-400 text-sm font-medium">{{ success }}</p>
    </div>
    {% endif %}

    <!-- Form Card -->
    <div class="glass-card rounded-2xl p-8">
        <form method="POST" action="/api/register-view/">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-6">
                <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Username</label>
                <input type="text" name="username" placeholder="Choose a username"
                       class="w-full rounded-xl px-4 py-3 text-white placeholder-white/25 font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50"
                       style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
            </div>

            <!-- Email -->
            <div class="mb-6">
                <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Email</label>
                <input type="email" name="email" placeholder="Enter your email"
                       class="w-full rounded-xl px-4 py-3 text-white placeholder-white/25 font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50"
                       style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Password</label>
                <input type="password" name="password" id="password" placeholder="Create a password"
                       class="w-full rounded-xl px-4 py-3 text-white placeholder-white/25 font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50"
                       style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
            </div>

            <!-- Confirm Password -->
            <div class="mb-8">
                <label class="block text-white/70 text-sm font-semibold mb-2 uppercase tracking-wider">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Repeat your password"
                       class="w-full rounded-xl px-4 py-3 text-white placeholder-white/25 font-medium outline-none transition focus:ring-2 focus:ring-violet-500/50"
                       style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);">
                <p id="password-match-msg" class="text-xs mt-2 hidden"></p>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary w-full py-4 text-base font-bold rounded-xl text-center">
                Create Account
            </button>
        </form>
    </div>

    <!-- Login Link -->
    <div class="text-center mt-6">
        <p class="text-white/30 text-sm">Already have an account?
            <a href="/api/login-view/" class="text-violet-400 hover:text-violet-300 font-semibold transition">Login here</a>
        </p>
    </div>

</div>

<script>
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm_password');
    const msg = document.getElementById('password-match-msg');

    confirm.addEventListener('input', () => {
        if (confirm.value === '') {
            msg.classList.add('hidden');
        } else if (password.value === confirm.value) {
            msg.textContent = '✅ Passwords match';
            msg.className = 'text-xs mt-2 text-emerald-400';
        } else {
            msg.textContent = '❌ Passwords do not match';
            msg.className = 'text-xs mt-2 text-red-400';
        }
    });
</script>

{% endblock %}
